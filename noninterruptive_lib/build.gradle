plugins {
    id 'com.android.library'
}

android {
    namespace 'com.amazic.noninterruptive' // Đặt tên bất kỳ theo chuẩn package
    compileSdk 35 // Khớp với bản compileSdk của mylibrary

    defaultConfig {
        minSdk 21
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    api(name: 'noninterruptive-release', ext: 'aar')
}