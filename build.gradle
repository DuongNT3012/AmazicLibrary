buildscript {
    ext {
        agp_version = '8.6.0'
    }
}// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'com.android.library' version '8.2.0' apply false
    id 'com.google.gms.google-services' version '4.3.15' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
}

ext {
    minSdkVersion = 21
    compileSdkVersion = 36
    targetSdkVersion = 36

    appcompat = "androidx.appcompat:appcompat:1.6.1"

    play = '25.0.0'
    playServicesAds = "com.google.android.gms:play-services-ads:$play"
}
allprojects {
    tasks.matching { it.name.contains("lintVital") }.configureEach {
        enabled = false
    }
}
task publishToMavenLocal {
    dependsOn ':noninterruptive-sdk:publishToMavenLocal'
    dependsOn ':mylibrary:publishToMavenLocal'
}